name: Raleigh live canary

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Live endpoint and schema canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run live canary
        env:
          CANARY_REPORT_PATH: canary-report.json
          RALEIGH_TIMEOUT: '45'
        run: python3 raleigh/scripts/canary.py

      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raleigh-canary-report
          path: canary-report.json
          retention-days: 30
