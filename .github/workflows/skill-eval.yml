name: Paired skill evaluation smoke

on:
  pull_request:
    paths:
      - '*/**'
      - 'eval_runner/**'
      - '.github/workflows/skill-eval.yml'
      - 'schemas/comparison-report-v1.schema.json'
      - 'schemas/release-eval-v1.schema.json'
  push:
    branches:
      - main
    paths:
      - '*/**'
      - 'eval_runner/**'
      - '.github/workflows/skill-eval.yml'
      - 'schemas/comparison-report-v1.schema.json'
      - 'schemas/release-eval-v1.schema.json'
  workflow_dispatch:
    inputs:
      run_model_smoke:
        description: Run the bounded StepFun smoke evaluation and advisory Jev audit for agent-skills
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  paired-eval-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run paired evaluation unit tests
        run: python3 eval_runner/tests/test_paired.py
      - name: Run release evaluation unit tests
        run: python3 eval_runner/tests/test_release.py
      - name: Run existing eval runner tests
        run: python3 eval_runner/tests/test_runner.py
      - name: Test advisory Jev eval audit
        run: python3 system-one/scripts/test_jev_eval_audit.py
      - name: Test private real-output calibration helper
        run: python3 system-one/scripts/test_jev_eval_calibration.py
      - name: Test complete changed-skill selection
        run: python3 eval_runner/tests/test_selection.py

  paired-eval-smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: paired-eval-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Detect changed skills with evals
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m eval_runner.selection \
            --base "$BASE_SHA" --max-skills 5 \
            --github-output "$GITHUB_OUTPUT" \
            --summary-output "$GITHUB_STEP_SUMMARY"
      - name: Run paired evaluation (fake adapter)
        if: steps.changed.outputs.manifests != ''
        env:
          MANIFESTS: ${{ steps.changed.outputs.manifests }}
        run: |
          exit_code=0
          for manifest in $MANIFESTS; do
            echo "=== Paired eval: $manifest ==="
            python3 -m eval_runner.paired "$manifest" \
              --adapter fake \
              --output-dir "eval-output-paired/$(dirname "$(dirname "$manifest")" | xargs basename)" \
              || exit_code=1
          done
          exit $exit_code
      - name: Upload paired eval artifacts
        if: always() && steps.changed.outputs.manifests != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paired-eval-artifacts
          path: eval-output-paired/
          retention-days: 7

  paired-eval-model:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_model_smoke)
    runs-on: [self-hosted, linux, agent-skills-eval]
    needs: paired-eval-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Check model endpoint
        id: endpoint
        env:
          EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL }}
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
          RUN_MODEL_SMOKE: ${{ inputs.run_model_smoke }}
        run: |
          if [ "$EVAL_BASE_URL" != "https://inference-api.nousresearch.com" ] || \
            [ -z "$EVAL_MODEL" ] || \
            [ -z "$NOUS_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$RUN_MODEL_SMOKE" = "true" ]; then
              echo "Configured model smoke target or credential is unavailable." >&2
              exit 1
            fi
            exit 0
          fi
          models_json=$(printf 'Authorization: Bearer %s\n' "$NOUS_API_KEY" | \
            curl -sf --connect-timeout 5 \
              -H @- \
              "$EVAL_BASE_URL/v1/models" 2>/dev/null) || models_json=""
          if [ -z "$models_json" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$RUN_MODEL_SMOKE" = "true" ]; then
              echo "Authenticated Nous endpoint preflight failed." >&2
              exit 1
            fi
            exit 0
          fi
          if ! printf '%s' "$models_json" | python3 -c '
          import json
          import sys

          expected = sys.argv[1]
          try:
              models = json.load(sys.stdin).get("data")
          except (json.JSONDecodeError, AttributeError):
              raise SystemExit(2)
          if not isinstance(models, list):
              raise SystemExit(2)
          raise SystemExit(0 if any(
              isinstance(model, dict) and model.get("id") == expected
              for model in models
          ) else 1)
          ' "$EVAL_MODEL" 2>/dev/null; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Configured model is not listed by the authenticated Nous endpoint." >&2
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Detect changed skills with evals
        id: changed
        if: steps.endpoint.outputs.available == 'true'
        env:
          BASE_SHA: ${{ github.event.before }}
          RUN_MODEL_SMOKE: ${{ inputs.run_model_smoke }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$RUN_MODEL_SMOKE" != "true" ]; then
              echo "manifests=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ ! -f agent-skills/evals/evals.json ]; then
              echo "The fixed model smoke manifest is missing." >&2
              exit 1
            fi
            echo "manifests=agent-skills/evals/evals.json" >> "$GITHUB_OUTPUT"
            echo "eligible_count=1" >> "$GITHUB_OUTPUT"
            echo "selected_count=1" >> "$GITHUB_OUTPUT"
            python3 - <<'PY'
          import json
          from pathlib import Path

          from eval_runner.selection import select, selection_evidence

          manifest = "agent-skills/evals/evals.json"
          evidence = selection_evidence(select([manifest], 1), Path.cwd())
          output = Path("eval-output-model/selection.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          PY
            printf '## Paired-eval selection\n\nManual StepFun smoke evaluation.\n\nEligible manifests: agent-skills/evals/evals.json.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 -m eval_runner.selection \
            --base "$BASE_SHA" --max-skills 5 \
            --github-output "$GITHUB_OUTPUT" \
            --summary-output "$GITHUB_STEP_SUMMARY" \
            --json-output eval-output-model/selection.json
      - name: Run paired evaluation (real model)
        if: steps.endpoint.outputs.available == 'true' && steps.changed.outputs.manifests != ''
        env:
          MANIFESTS: ${{ steps.changed.outputs.manifests }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL }}
          EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
          EVAL_API_KEY: ${{ secrets.NOUS_API_KEY }}
        run: |
          exit_code=0
          for manifest in $MANIFESTS; do
            skill=$(dirname "$(dirname "$manifest")" | xargs basename)
            echo "=== Paired eval (model): $skill ==="
            python3 -m eval_runner.paired "$manifest" \
              --adapter openai \
              --base-url "$EVAL_BASE_URL" \
              --model "$EVAL_MODEL" \
              --max-tokens 4096 \
              --timeout 300 \
              --output-dir "eval-output-model/$skill" \
              || exit_code=1
          done
          exit $exit_code
      - name: Upload model eval artifacts
        if: always() && steps.endpoint.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paired-eval-model-artifacts
          path: eval-output-model/
          retention-days: 14

  jev-eval-audit:
    # Advisory only: never changes a paired-eval or required validation verdict.
    # Model evals upload artifacts even on failure; audit those failures too.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_model_smoke))
    runs-on: ubuntu-latest
    needs: paired-eval-model
    continue-on-error: true
    steps:
      - name: Check out trusted main-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Download generated model eval artifacts as data
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: paired-eval-model-artifacts
          path: eval-output-model
      - name: Audit prose assertions with Jev
        id: audit
        if: steps.download.outcome == 'success'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          python3 system-one/scripts/jev_eval_audit.py \
            --reports eval-output-model \
            --selection eval-output-model/selection.json \
            --live \
            --max-calls 22 \
            --max-assertions 160 \
            --output jev-eval-audit.json \
            --summary-output "$GITHUB_STEP_SUMMARY"
      - name: Explain audit failure without a report
        if: always() && steps.download.outcome == 'success' && steps.audit.outcome == 'failure' && hashFiles('jev-eval-audit.json') == ''
        run: |
          echo '## Jev paired-eval audit (advisory)' >> "$GITHUB_STEP_SUMMARY"
          echo 'The audit failed before writing a report; no Jev coverage can be claimed. Check the job log for input or credential errors.' >> "$GITHUB_STEP_SUMMARY"
      - name: Explain missing model artifact
        if: steps.download.outcome != 'success'
        run: |
          echo '## Jev paired-eval audit (advisory)' >> "$GITHUB_STEP_SUMMARY"
          echo 'No model artifact was available; no Jev judgments were made. This is missing evidence, not a pass.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload advisory audit evidence
        if: always() && steps.download.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jev-eval-audit
          path: jev-eval-audit.json
          if-no-files-found: ignore
          retention-days: 14
