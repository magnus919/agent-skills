name: Droid Auto Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  droid-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Configure Nous Portal model
        run: |
          mkdir -p "$HOME/.factory"
          cat > "$HOME/.factory/settings.json" <<'FACTORY_JSON'
          {
            "customModels": [{
              "model": "openai/gpt-6-luna",
              "displayName": "GPT-6 Luna (Nous Portal)",
              "baseUrl": "http://127.0.0.1:8765/v1",
              "apiKey": "${NOUS_API_KEY}",
              "provider": "openai",
              "maxOutputTokens": 16384
            }]
          }
          FACTORY_JSON
      - name: Check Nous Portal Responses compatibility
        env:
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
        run: |
          if [ -z "$NOUS_API_KEY" ]; then
            echo 'NOUS_API_KEY is unavailable to this run' >&2
            exit 1
          fi
          failed=0
          for test_case in basic low tools streaming unprefixed; do
            case "$test_case" in
              basic) payload='{"model":"openai/gpt-6-luna","input":"Reply OK"}' ;;
              low) payload='{"model":"openai/gpt-6-luna","input":"Reply OK","reasoning":{"effort":"low"}}' ;;
              tools) payload='{"model":"openai/gpt-6-luna","input":"Reply OK","reasoning":{"effort":"low"},"tools":[{"type":"function","name":"noop","description":"No operation","parameters":{"type":"object","properties":{}}}]}' ;;
              streaming) payload='{"model":"openai/gpt-6-luna","input":"Reply OK","reasoning":{"effort":"low"},"tools":[{"type":"function","name":"noop","description":"No operation","parameters":{"type":"object","properties":{}}}],"stream":true}' ;;
              unprefixed) payload='{"model":"gpt-6-luna","input":"Reply OK","reasoning":{"effort":"low"}}' ;;
            esac
            status=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $NOUS_API_KEY" \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              https://inference-api.nousresearch.com/v1/responses)
            echo "$test_case Responses probe: HTTP $status"
            if [ "$status" != 200 ] && [ "$test_case" != unprefixed ]; then failed=1; fi
          done
          exit "$failed"
      - name: Start local request-shape diagnostic
        run: |
          python3 -u .github/scripts/droid-request-shape-probe.py > "$RUNNER_TEMP/droid-shape.log" 2>&1 &
          sleep 1
      - name: Run Droid Auto Review
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          review_depth: shallow
          review_model: openai/gpt-6-luna
          security_model: openai/gpt-6-luna
          reasoning_effort: low
        env:
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
      - name: Show sanitized request shape
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/droid-shape.log" ]; then
            grep 'DROID_REQUEST_SHAPE' "$RUNNER_TEMP/droid-shape.log" || true
          fi
