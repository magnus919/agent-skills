name: Droid Auto Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  droid-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Configure Nous Portal model
        run: |
          mkdir -p "$HOME/.factory"
          cat > "$HOME/.factory/settings.json" <<'FACTORY_JSON'
          {
            "customModels": [{
              "model": "openai/gpt-6-luna",
              "displayName": "GPT-6 Luna (Nous Portal)",
              "baseUrl": "https://inference-api.nousresearch.com/v1",
              "apiKey": "${NOUS_API_KEY}",
              "provider": "generic-chat-completion-api",
              "maxOutputTokens": 16384
            }]
          }
          FACTORY_JSON
      - name: Run Droid Auto Review
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          review_depth: shallow
          review_model: openai/gpt-6-luna
          security_model: openai/gpt-6-luna
          reasoning_effort: low
        env:
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
