name: Jev QA pilot (advisory)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed default-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify pilot harness without a secret
        run: python3 system-one/scripts/test_jev_qa_pilot.py
      - name: Run bounded synthetic pilot
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python3 system-one/scripts/jev_qa_pilot.py --live --max-calls 22
