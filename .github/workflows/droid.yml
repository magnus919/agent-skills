name: Droid Tag

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, edited]

jobs:
  droid:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@droid')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@droid')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@droid')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@droid') || contains(github.event.issue.title, '@droid'))) ||
      (github.event_name == 'pull_request' && (contains(github.event.pull_request.body, '@droid') || contains(github.event.pull_request.title, '@droid')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # BYOK: register Poolside Laguna S 2.1 through Nous Portal where the Droid CLI
      # reads it (~/.factory/settings.json). The droid-action's `settings`
      # input writes to ~/.factory/droid/settings.json, which the CLI does not
      # read for customModels, so the model must be written here explicitly.
      # The API key is referenced as ${NOUS_API_KEY} and expanded by the
      # CLI from the step env at request time.
      - name: Configure BYOK model (Laguna S 2.1 via Nous Portal)
        shell: bash
        run: |
          if [ -z "$NOUS_API_KEY" ]; then
            echo 'NOUS_API_KEY is unavailable to this run' >&2
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.factory"
          cat > "$HOME/.factory/settings.json" <<'FACTORY_JSON'
          {
            "customModels": [
              {
                "model": "poolside/laguna-s-2.1:free",
                "displayName": "Laguna S 2.1 (Nous Portal)",
                "baseUrl": "https://inference-api.nousresearch.com/v1",
                "apiKey": "${NOUS_API_KEY}",
                "provider": "generic-chat-completion-api",
                "maxOutputTokens": 16384
              }
            ]
          }
          FACTORY_JSON
        env:
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
      - name: Run Droid Exec
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          review_model: custom:Laguna-S-2.1-(Nous-Portal)-0
          security_model: custom:Laguna-S-2.1-(Nous-Portal)-0
        env:
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
